name: Patch Intervenantes replacement UI

'on':
  push:
    branches:
      - feature/intervenantes-replacements

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch loaders and role guard
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Marker not found: {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          note = Path('intervenantes/note-filter.js')
          text = note.read_text(encoding='utf-8')
          marker = '''    const notificationsLoaded = [...document.scripts].some((script) => /(?:^|\\/)notifications-local\\.js(?:$|\\?)/.test(script.src));\n'''
          loader = '''    const planningReplacementLoaded = [...document.scripts].some((script) => /(?:^|\\/)planning-replacement\\.js(?:$|\\?)/.test(script.src));\n    if (!planningReplacementLoaded) {\n      const script = document.createElement('script');\n      script.src = './planning-replacement.js?v=20260912-1';\n      script.dataset.acjPlanningReplacement = '1';\n      document.body.appendChild(script);\n    }\n\n'''
          if marker not in text:
              raise SystemExit('note-filter marker not found')
          note.write_text(text.replace(marker, loader + marker, 1), encoding='utf-8')

          replace_once(
              'intervenantes/index.html',
              './note-filter.js?v=20260908-3',
              './note-filter.js?v=20260912-1',
          )
          replace_once(
              'intervenantes/role-guard.js',
              ".acjPlanningAdd,#acjDayAdd,#acjEditSave,#acjCancelService",
              ".acjPlanningAdd,#acjDayAdd,#acjEditSave,#acjCancelService,.acjReplaceOpen",
          )
          Path('.github/workflows/patch-intervenantes-replacement.yml').unlink()
          PY
      - name: Check JavaScript syntax
        run: |
          node --check intervenantes/planning-replacement.js
          node --check intervenantes/note-filter.js
          node --check intervenantes/role-guard.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ACJ Intervenantes: brancher les remplacements dans le planning [skip ci]"
          git push origin HEAD:feature/intervenantes-replacements
