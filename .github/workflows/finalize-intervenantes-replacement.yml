name: Finalize Intervenantes replacement guard

'on':
  push:
    branches:
      - feature/intervenantes-replacements

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require confirmed server admin role
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('intervenantes/planning-replacement.js')
          text = p.read_text(encoding='utf-8')
          old = "return window.ACJ_INTERVENANTES_ROLE === 'admin' || localStorage.getItem('acj_intervenantes_role') === 'admin';"
          new = "return window.ACJ_INTERVENANTES_ROLE === 'admin';"
          if old not in text:
              raise SystemExit('admin guard marker not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/finalize-intervenantes-replacement.yml').unlink()
          PY
      - name: Check JavaScript syntax
        run: node --check intervenantes/planning-replacement.js
      - name: Commit final guard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ACJ Intervenantes: exiger le rôle admin confirmé"
          git push origin HEAD:feature/intervenantes-replacements
