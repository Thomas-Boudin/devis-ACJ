name: Smoke tests Devis ACJ

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/acj-dom" jsdom@26.1.0 fake-indexeddb@6 --no-audit --no-fund
      - name: Verify the quote workflow
        env:
          ACJ_DOM_TEST_DEPS: ${{ runner.temp }}/acj-dom/node_modules
        run: |
          set -e
          for test in tests/*.mjs; do
            node "$test"
          done

