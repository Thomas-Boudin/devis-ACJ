name: Patch Intervenantes startup
on:
  push:
    branches:
      - fix/intervenantes-startup-stuck
    paths:
      - .github/workflows/patch-intervenantes-startup.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/intervenantes-startup-stuck
      - run: python .github/scripts/patch_intervenantes_startup.py
      - run: node --check intervenantes/note-filter.js
      - run: grep -q 'note-filter.js?v=20260912-3' intervenantes/index.html
      - run: grep -q 'STARTUP_TIMEOUT' intervenantes/note-filter.js
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ACJ Intervenantes: fiabiliser le démarrage PWA'
          git push origin HEAD:fix/intervenantes-startup-stuck
