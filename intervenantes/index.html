<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>ACJ Intervenantes</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./note-filter.js"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f172a;background:#f4f7fb;--ink:#0f172a;--muted:#64748b;--line:#dbe3ee;--accent:#0f766e}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;min-width:320px}button,select,input{font:inherit}.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 0%,rgba(15,118,110,.14),transparent 36%),linear-gradient(180deg,#f8fafc,#eef3f8)}.authCard{width:min(100%,430px);background:white;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 14px 40px rgba(15,23,42,.08)}.logo{width:58px;height:58px;border-radius:18px;background:var(--ink);color:white;display:grid;place-items:center;font-weight:900;margin-bottom:24px}.authCard h1{font-size:28px;margin:0 0 8px}.muted{color:var(--muted);line-height:1.5}.google{margin-top:24px;min-height:48px}.status{color:#b91c1c;font-size:14px;min-height:22px;margin-top:14px}.app{max-width:760px;margin:auto;padding:18px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.14em}.top h1{margin:3px 0 0;font-size:25px}.logout{border:0;border-radius:999px;padding:10px 14px;background:#e9eef5;font-weight:800}.picker,.summary,.datebar,.card,.empty{background:white;border:1px solid var(--line);border-radius:20px}.picker{padding:13px 14px;margin-top:14px}.picker label{display:block;font-size:11px;font-weight:900;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}.picker select{width:100%;min-height:46px;border:1px solid #cbd5e1;border-radius:13px;padding:0 12px;background:#f8fafc;font-weight:750}.datebar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;margin-top:12px;padding:8px}.datebar button{border:0;background:#f8fafc;border-radius:13px;min-height:48px}.dateMain{display:grid;place-content:center;text-align:center}.dateMain strong{font-size:15px}.dateMain span{font-size:11px;color:var(--muted)}#datePicker{position:absolute;opacity:0;pointer-events:none}.summary{margin-top:12px;padding:16px;background:var(--ink);color:white;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.summary small{display:block;color:#cbd5e1;margin-bottom:5px}.summary strong{font-size:18px}.banner{margin-top:12px;padding:11px 13px;border-radius:13px;background:#ecfdf5;color:#166534;border:1px solid #bbf7d0;font-size:12px;font-weight:700}.list{display:grid;gap:12px;margin-top:12px}.card{padding:16px}.cardHead{display:flex;justify-content:space-between;gap:12px}.time{font-weight:900}.type{font-size:11px;color:var(--accent);font-weight:900;text-transform:uppercase;letter-spacing:.05em}.client{font-size:19px;font-weight:850;margin-top:4px}.address{color:#475569;font-size:14px;line-height:1.45;margin-top:10px}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.chip{background:#f1f5f9;border-radius:999px;padding:6px 9px;font-size:12px;color:#475569;font-weight:700}.note{margin-top:11px;padding:10px 12px;border-left:3px solid var(--accent);background:#f8fafc;border-radius:10px;color:#334155;font-size:13px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.actions a{min-height:42px;border:1px solid #cbd5e1;border-radius:12px;display:grid;place-items:center;text-decoration:none;color:#334155;font-size:13px;font-weight:800}.pointage{width:100%;margin-top:9px;min-height:48px;border:0;border-radius:14px;background:#e2e8f0;color:#64748b;font-weight:900}.empty{padding:26px;text-align:center;color:var(--muted)}[hidden]{display:none!important}
</style>
</head>
<body>
<main id="login" class="auth"><section class="authCard"><div class="logo">ACJ</div><h1>ACJ Intervenantes</h1><p class="muted">Planning ménage connecté à Ogust.</p><div id="googleButton" class="google"></div><p id="loginStatus" class="status"></p></section></main>
<div id="app" class="app" hidden>
<header class="top"><div><div class="eyebrow">ACJ SERVICES</div><h1>ACJ Intervenantes</h1></div><button id="logout" class="logout">Quitter</button></header>
<section class="picker"><label for="employee">Choisir une intervenante</label><select id="employee"><option value="" selected disabled>Choisir une intervenante</option></select></section>
<section class="datebar"><button id="prev">‹</button><button id="dateButton" class="dateMain"><strong id="dateTitle"></strong><span id="dateSub"></span></button><button id="next">›</button><input id="datePicker" type="date"></section>
<section class="summary"><div><small>Prestations</small><strong id="count">—</strong></div><div><small>Heures prévues</small><strong id="hours">—</strong></div></section>
<div class="banner">Connexion Ogust active · pointage désactivé pendant le test.</div>
<section id="list" class="list"><div class="empty">Choisissez une intervenante ménage pour afficher sa journée.</div></section>
</div>
<script>
const CLIENT_ID='93181159242-i64qf82vtrij5c4b7l5q18ctjj48l3so.apps.googleusercontent.com';
const API='https://acj-ogust-proxy.vercel.app/api/intervenante-pilot';
const TOKEN='acj_intervenantes_google_token';
let date=today();const $=id=>document.getElementById(id);
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function plus(v,n){const [y,m,d]=v.split('-').map(Number),x=new Date(y,m-1,d,12);x.setDate(x.getDate()+n);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function fmt(v){const [y,m,d]=v.split('-').map(Number),x=new Date(y,m-1,d,12);return {a:v===today()?"Aujourd'hui":new Intl.DateTimeFormat('fr-FR',{weekday:'long'}).format(x),b:new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'}).format(x)}}
function mins(a,b){if(!/^\d\d:\d\d$/.test(a||'')||!/^\d\d:\d\d$/.test(b||''))return 0;const [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number);return Math.max(0,bh*60+bm-ah*60-am)}
function dur(n){const h=Math.floor(n/60),m=n%60;return h?(m?`${h} h ${String(m).padStart(2,'0')}`:`${h} h`):`${m} min`}
function token(){return sessionStorage.getItem(TOKEN)||''}
function setDate(v){date=v;$('datePicker').value=v;const f=fmt(v);$('dateTitle').textContent=f.a.charAt(0).toUpperCase()+f.a.slice(1);$('dateSub').textContent=f.b;if(!$('app').hidden&&$('employee').value)loadPlanning()}
async function call(params){const u=new URL(API);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u,{headers:{Authorization:`Bearer ${token()}`},cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`HTTP_${r.status}`);return j}
async function loadConfig(){const j=await call({action:'config'});const sel=$('employee');sel.innerHTML='<option value="" selected disabled>Choisir une intervenante</option>';for(const e of j.employees||[]){const o=document.createElement('option');o.value=e.id_employee;o.textContent=e.label;sel.appendChild(o)}$('count').textContent='—';$('hours').textContent='—';$('list').innerHTML='<div class="empty">Choisissez une intervenante ménage pour afficher sa journée.</div>'}
async function loadPlanning(){const id=$('employee').value;if(!id){$('count').textContent='—';$('hours').textContent='—';$('list').innerHTML='<div class="empty">Choisissez une intervenante ménage pour afficher sa journée.</div>';return}$('list').innerHTML='<div class="empty">Chargement du planning Ogust…</div>';$('count').textContent='—';$('hours').textContent='—';try{const j=await call({action:'planning',employee_id:id,date});render(j.services||[])}catch(e){$('list').innerHTML=`<div class="empty">Planning indisponible (${e.message}).</div>`}}
function render(rows){$('list').innerHTML='';$('count').textContent=`${rows.length} prestation${rows.length>1?'s':''}`;const total=rows.reduce((s,x)=>s+mins(x.start_time,x.end_time),0);$('hours').textContent=total?dur(total):'0 h';if(!rows.length){$('list').innerHTML='<div class="empty">Aucune prestation prévue pour cette journée.</div>';return}for(const s of rows){const c=s.customer||{},p=s.product||{};const art=document.createElement('article');art.className='card';const phone=String(c.phone||'').replace(/[^+\d]/g,'');const address=String(c.address||'');const note=[s.alert,s.comment,s.task_list].map(window.meaningfulOgustNote).filter(Boolean).join(' — ');art.innerHTML=`<div class="cardHead"><div><div class="type">${esc(p.label||'Prestation')}</div><div class="client">${esc(c.name||'Client')}</div></div><div class="time">${esc([s.start_time,s.end_time].filter(Boolean).join(' – '))}</div></div><div class="address">${esc(address||'Adresse non remontée par Ogust')}</div><div class="meta">${s.distance?`<span class="chip">${esc(s.distance)} km</span>`:''}${s.journey_time?`<span class="chip">Trajet ${esc(s.journey_time)}</span>`:''}</div>${note?`<div class="note">${esc(note)}</div>`:''}<div class="actions">${address?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}">Itinéraire</a>`:''}${phone?`<a href="tel:${phone}">Appeler</a>`:''}</div><button class="pointage" disabled>Pointage en préparation</button>`;$('list').appendChild(art)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function googleLogin(r){if(!r?.credential)return;$('loginStatus').textContent='Connexion…';sessionStorage.setItem(TOKEN,r.credential);try{await loadConfig();$('login').hidden=true;$('app').hidden=false;setDate(date)}catch(e){sessionStorage.removeItem(TOKEN);$('loginStatus').textContent=`Connexion refusée (${e.message}).`}}
function initGoogle(){const wait=()=>{if(!window.google?.accounts?.id)return setTimeout(wait,150);google.accounts.id.initialize({client_id:CLIENT_ID,callback:googleLogin,auto_select:false});google.accounts.id.renderButton($('googleButton'),{theme:'outline',size:'large',shape:'pill',text:'continue_with',width:300})};wait()}
$('employee').addEventListener('change',loadPlanning);$('prev').onclick=()=>setDate(plus(date,-1));$('next').onclick=()=>setDate(plus(date,1));$('dateButton').onclick=()=>typeof $('datePicker').showPicker==='function'?$('datePicker').showPicker():$('datePicker').click();$('datePicker').onchange=()=>$('datePicker').value&&setDate($('datePicker').value);$('logout').onclick=()=>{sessionStorage.removeItem(TOKEN);$('app').hidden=true;$('login').hidden=false;$('loginStatus').textContent='';google.accounts.id.disableAutoSelect()};setDate(date);initGoogle();
</script>
</body>
</html>
