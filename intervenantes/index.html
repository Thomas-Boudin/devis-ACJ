<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>ACJ Intervenantes</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="./note-filter.js?v=20260912-3"></script>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f172a;background:#f4f7fb;--ink:#0f172a;--muted:#64748b;--line:#dbe3ee;--accent:#0f766e;--accent2:#14b8a6;--soft:#ecfdf5;--danger:#b91c1c;--panel:#fff}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;min-width:320px}button,select,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 10% 0%,rgba(15,118,110,.14),transparent 36%),linear-gradient(180deg,#f8fafc,#eef3f8)}.authCard{width:min(100%,430px);background:white;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:0 14px 40px rgba(15,23,42,.08)}.logo{width:58px;height:58px;border-radius:18px;background:var(--ink);color:white;display:grid;place-items:center;font-weight:900;margin-bottom:24px}.authCard h1{font-size:28px;margin:0 0 8px}.muted{color:var(--muted);line-height:1.5}.google{margin-top:24px;min-height:48px}.status{color:#b91c1c;font-size:14px;min-height:22px;margin-top:14px}.app{max-width:760px;margin:auto;padding:14px 12px 110px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 2px 8px}.brandRow{display:flex;align-items:center;gap:10px}.miniLogo{width:38px;height:38px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:900}.eyebrow{color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.14em}.top h1{margin:1px 0 0;font-size:21px;letter-spacing:-.02em}.logout{border:0;border-radius:999px;padding:9px 13px;background:#e9eef5;color:#334155;font-size:12px;font-weight:800}.pilot{margin-top:8px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}.pilotBadge{font-size:10px;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}.pilot select{width:100%;min-height:40px;border:0;background:#f8fafc;border-radius:11px;padding:0 10px;font-weight:800;color:#0f172a;outline:none}.datebar{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;margin-top:10px;padding:7px;background:#fff;border:1px solid var(--line);border-radius:18px}.datebar button{border:0;background:#f8fafc;border-radius:12px;min-height:46px;color:#0f172a}.dateMain{display:grid;place-content:center;text-align:center}.dateMain strong{font-size:15px}.dateMain span{font-size:11px;color:var(--muted);margin-top:2px}#datePicker{position:absolute;opacity:0;pointer-events:none}.dayStrip{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:0 2px}.dayTitle{font-size:22px;font-weight:900;letter-spacing:-.025em}.dayMeta{color:var(--muted);font-size:12px;font-weight:700}.sync{display:flex;align-items:center;gap:7px;color:#166534;font-size:11px;font-weight:800;white-space:nowrap}.syncDot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.12)}.summary{margin-top:10px;padding:13px 14px;background:var(--ink);color:white;border-radius:18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.summaryMain{font-size:15px;font-weight:850}.summaryMain strong{font-size:19px}.summarySub{color:#cbd5e1;font-size:12px;text-align:right}.list{display:grid;gap:11px;margin-top:11px}.sectionLabel{margin:14px 2px 7px;color:#64748b;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;box-shadow:0 5px 18px rgba(15,23,42,.04)}.card.hero{border:1.5px solid rgba(15,118,110,.45);box-shadow:0 12px 30px rgba(15,118,110,.10);padding:16px}.heroTag{display:none}.card.hero .heroTag{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:#166534;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin-bottom:11px}.heroTag::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent2)}.cardHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.timeBlock{min-width:76px;text-align:right}.time{font-weight:900;font-size:16px;white-space:nowrap}.duration{font-size:11px;color:var(--muted);margin-top:2px}.type{font-size:10px;color:var(--accent);font-weight:900;text-transform:uppercase;letter-spacing:.06em}.client{font-size:19px;font-weight:900;margin-top:4px;line-height:1.15;letter-spacing:-.015em}.card.hero .client{font-size:22px}.address{color:#475569;font-size:13px;line-height:1.4;margin-top:10px}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{background:#f1f5f9;border-radius:999px;padding:5px 8px;font-size:11px;color:#475569;font-weight:750}.note{margin-top:10px;padding:9px 11px;border-left:3px solid var(--accent);background:#f8fafc;border-radius:9px;color:#334155;font-size:12px;line-height:1.4}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.actions a{min-height:40px;border:1px solid #cbd5e1;border-radius:11px;display:grid;place-items:center;text-decoration:none;color:#334155;font-size:12px;font-weight:850;background:#fff}.pointage{width:100%;margin-top:8px;min-height:52px;border:0;border-radius:13px;background:#e2e8f0;color:#64748b;font-weight:900;font-size:14px;letter-spacing:.01em}.card.hero .pointage{min-height:58px;font-size:16px}.empty{background:#fff;border:1px solid var(--line);border-radius:19px;padding:26px;text-align:center;color:var(--muted)}.bottomNav{position:fixed;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(calc(100% - 20px),740px);background:rgba(15,23,42,.97);border-radius:20px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;box-shadow:0 18px 45px rgba(15,23,42,.24);backdrop-filter:blur(12px);z-index:20}.navItem{border:0;background:transparent;color:#94a3b8;border-radius:13px;min-height:48px;font-size:11px;font-weight:800}.navItem.active{background:rgba(255,255,255,.12);color:#fff}.navItem[disabled]{opacity:.45}.loading{padding:22px;text-align:center;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:19px}[hidden]{display:none!important}@media(max-width:430px){.app{padding-left:10px;padding-right:10px}.pilot{grid-template-columns:1fr}.pilotBadge{margin-left:2px}.dayTitle{font-size:20px}.summary{padding:12px}.card{padding:13px}.card.hero{padding:15px}.client{font-size:18px}.card.hero .client{font-size:21px}}
</style>
</head>
<body>
<main id="login" class="auth"><section class="authCard"><div class="logo">ACJ</div><h1>ACJ Intervenantes</h1><p class="muted">Votre journée, vos clients et votre pointage au même endroit.</p><div id="googleButton" class="google"></div><p id="loginStatus" class="status"></p></section></main>
<div id="app" class="app" hidden>
<header class="top"><div class="brandRow"><div class="miniLogo">ACJ</div><div><div class="eyebrow">ACJ SERVICES</div><h1>Ma journée</h1></div></div><button id="logout" class="logout">Quitter</button></header>
<section class="pilot"><span class="pilotBadge">Mode pilote</span><select id="employee"><option value="" selected disabled>Choisir une intervenante</option></select></section>
<section class="datebar"><button id="prev" aria-label="Jour précédent">‹</button><button id="dateButton" class="dateMain"><strong id="dateTitle"></strong><span id="dateSub"></span></button><button id="next" aria-label="Jour suivant">›</button><input id="datePicker" type="date"></section>
<div class="dayStrip"><div><div class="dayTitle" id="dayHeading">Aujourd'hui</div><div class="dayMeta" id="dayMeta">Choisissez une intervenante</div></div><div class="sync"><span class="syncDot"></span>Ogust</div></div>
<section class="summary"><div class="summaryMain"><strong id="count">—</strong></div><div class="summarySub"><span id="hours">—</span> prévues</div></section>
<section id="list" class="list"><div class="empty">Choisissez une intervenante ménage pour afficher sa journée.</div></section>
<nav class="bottomNav" aria-label="Navigation"><button class="navItem active">Aujourd'hui</button><button class="navItem" disabled>Planning</button><button class="navItem">Liaison</button><button class="navItem" disabled>Moi</button></nav>
</div>
<script>
const CLIENT_ID='93181159242-i64qf82vtrij5c4b7l5q18ctjj48l3so.apps.googleusercontent.com';
const API='https://acj-ogust-proxy.vercel.app/api/intervenante-pilot';
const TOKEN='acj_intervenantes_google_token';
let date=today();const $=id=>document.getElementById(id);
function today(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function plus(v,n){const [y,m,d]=v.split('-').map(Number),x=new Date(y,m-1,d,12);x.setDate(x.getDate()+n);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function fmt(v){const [y,m,d]=v.split('-').map(Number),x=new Date(y,m-1,d,12);return {a:v===today()?"Aujourd'hui":new Intl.DateTimeFormat('fr-FR',{weekday:'long'}).format(x),b:new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'}).format(x)}}
function mins(a,b){if(!/^\d\d:\d\d$/.test(a||'')||!/^\d\d:\d\d$/.test(b||''))return 0;const [ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number);return Math.max(0,bh*60+bm-ah*60-am)}
function dur(n){const h=Math.floor(n/60),m=n%60;return h?(m?`${h} h ${String(m).padStart(2,'0')}`:`${h} h`):`${m} min`}
function token(){return sessionStorage.getItem(TOKEN)||''}
function setDate(v){date=v;$('datePicker').value=v;const f=fmt(v);$('dateTitle').textContent=f.a.charAt(0).toUpperCase()+f.a.slice(1);$('dateSub').textContent=f.b;$('dayHeading').textContent=f.a.charAt(0).toUpperCase()+f.a.slice(1);if(!$('app').hidden&&$('employee').value)loadPlanning()}
async function call(params){const u=new URL(API);Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));const r=await fetch(u,{headers:{Authorization:`Bearer ${token()}`},cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||`HTTP_${r.status}`);return j}
async function loadConfig(){const j=await call({action:'config'});const sel=$('employee');sel.innerHTML='<option value="" selected disabled>Choisir une intervenante</option>';for(const e of j.employees||[]){const o=document.createElement('option');o.value=e.id_employee;o.textContent=e.label;sel.appendChild(o)}$('count').textContent='—';$('hours').textContent='—';$('dayMeta').textContent='Choisissez une intervenante';$('list').innerHTML='<div class="empty">Choisissez une intervenante ménage pour afficher sa journée.</div>';const login=$('login'),app=$('app'),status=$('loginStatus');if(login)login.hidden=true;if(app)app.hidden=false;if(status)status.textContent=''}
async function loadPlanning(){const id=$('employee').value;if(!id){$('count').textContent='—';$('hours').textContent='—';$('dayMeta').textContent='Choisissez une intervenante';$('list').innerHTML='<div class="empty">Choisissez une intervenante ménage pour afficher sa journée.</div>';return}$('list').innerHTML='<div class="loading">Chargement du planning Ogust…</div>';$('count').textContent='—';$('hours').textContent='—';$('dayMeta').textContent=$('employee').selectedOptions[0]?.textContent||'';try{const j=await call({action:'planning',employee_id:id,date});render(j.services||[])}catch(e){$('list').innerHTML=`<div class="empty">Planning indisponible (${e.message}).</div>`}}
function isHero(rows,index){if(index!==0&&date!==today())return false;if(date!==today())return index===0;const now=new Date();const hm=new Intl.DateTimeFormat('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(now);for(let i=0;i<rows.length;i++){if((rows[i].end_time||'99:99')>=hm)return i===index}return index===rows.length-1}
function render(rows){$('list').innerHTML='';$('count').textContent=`${rows.length} prestation${rows.length>1?'s':''}`;const total=rows.reduce((s,x)=>s+mins(x.start_time,x.end_time),0);$('hours').textContent=total?dur(total):'0 h';$('dayMeta').textContent=$('employee').selectedOptions[0]?.textContent||'';if(!rows.length){$('list').innerHTML='<div class="empty">Aucune prestation prévue pour cette journée.</div>';return}for(let i=0;i<rows.length;i++){const s=rows[i],c=s.customer||{},p=s.product||{};const art=document.createElement('article');art.className='card'+(isHero(rows,i)?' hero':'');const phone=String(c.phone||'').replace(/[^+\d]/g,'');const address=String(c.address||'');const note=[s.alert,s.comment,s.task_list].map(window.meaningfulOgustNote).filter(Boolean).join(' — ');const d=mins(s.start_time,s.end_time);art.innerHTML=`<div class="heroTag">${date===today()?'Prochaine intervention':'Première intervention'}</div><div class="cardHead"><div><div class="type">${esc(p.label||'Prestation')}</div><div class="client">${esc(c.name||'Client')}</div></div><div class="timeBlock"><div class="time">${esc([s.start_time,s.end_time].filter(Boolean).join(' – '))}</div><div class="duration">${d?esc(dur(d)):''}</div></div></div><div class="address">${esc(address||'Adresse non remontée par Ogust')}</div><div class="meta">${s.distance&&Number(s.distance)>0?`<span class="chip">${esc(s.distance)} km</span>`:''}${s.journey_time&&String(s.journey_time)!=='0'?`<span class="chip">Trajet ${esc(s.journey_time)}</span>`:''}</div>${note?`<div class="note">${esc(note)}</div>`:''}<div class="actions">${address?`<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}">Itinéraire</a>`:'<span></span>'}${phone?`<a href="tel:${phone}">Appeler</a>`:'<span></span>'}</div><button class="pointage" disabled>Pointage en préparation</button>`;$('list').appendChild(art)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function googleLogin(r){if(!r?.credential)return;$('loginStatus').textContent='Connexion…';sessionStorage.setItem(TOKEN,r.credential);try{await loadConfig();$('login').hidden=true;$('app').hidden=false;setDate(date)}catch(e){sessionStorage.removeItem(TOKEN);$('loginStatus').textContent=`Connexion refusée (${e.message}).`}}
function initGoogle(){const wait=()=>{if(!window.google?.accounts?.id)return setTimeout(wait,150);google.accounts.id.initialize({client_id:CLIENT_ID,callback:googleLogin,auto_select:false});google.accounts.id.renderButton($('googleButton'),{theme:'outline',size:'large',shape:'pill',text:'continue_with',width:300})};wait()}
$('employee').addEventListener('change',loadPlanning);$('prev').onclick=()=>setDate(plus(date,-1));$('next').onclick=()=>setDate(plus(date,1));$('dateButton').onclick=()=>typeof $('datePicker').showPicker==='function'?$('datePicker').showPicker():$('datePicker').click();$('datePicker').onchange=()=>$('datePicker').value&&setDate($('datePicker').value);$('logout').onclick=()=>{sessionStorage.removeItem(TOKEN);$('app').hidden=true;$('login').hidden=false;$('loginStatus').textContent='';google.accounts.id.disableAutoSelect()};setDate(date);initGoogle();
</script>
<script src="./pointage-local.js?v=20260908-3"></script>
<script src="./liaison-local.js?v=20260908-3"></script>
</body>
</html>
