<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Réinitialisation ACJ Intervenantes</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#0f172a;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}.card{width:min(100%,430px);background:#fff;border:1px solid #dbe3ee;border-radius:28px;padding:28px;box-shadow:0 14px 40px rgba(15,23,42,.08)}.logo{width:58px;height:58px;border-radius:18px;background:#0f172a;color:#fff;display:grid;place-items:center;font-weight:900;margin-bottom:20px}h1{font-size:24px;margin:0 0 10px}p{color:#64748b;line-height:1.5;margin:0}
</style>
</head>
<body>
<section class="card"><div class="logo">ACJ</div><h1>Réinitialisation de la connexion</h1><p id="status">Nettoyage de la session locale…</p></section>
<script>
(() => {
  const keys = ['acj_intervenantes_google_token', 'acj_intervenantes_role'];
  for (const key of keys) {
    try { localStorage.removeItem(key); } catch {}
    try { sessionStorage.removeItem(key); } catch {}
  }
  const status = document.getElementById('status');
  if (status) status.textContent = 'Session nettoyée. Retour vers ACJ Intervenantes…';
  setTimeout(() => location.replace('./?v=20260912-reset1'), 500);
})();
</script>
</body>
</html>
