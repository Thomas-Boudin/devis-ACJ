<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Devis ACJ Services</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0ea5e9">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#0b1220;--card:#111827;--text:#e5e7eb;--muted:#9ca3af;--accent:#0ea5e9;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:linear-gradient(180deg,#0b1220,#0e1726);color:var(--text)}
header{padding:1rem;border-bottom:1px solid #1f2937}
h1{margin:0;font-size:1.1rem}
main{padding:1rem}
.card{background:var(--card);border:1px solid #1f2937;border-radius:16px;padding:1rem;margin-bottom:1rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
label{display:flex;flex-direction:column;font-size:.9rem}
input,select,textarea{padding:.7rem;border-radius:10px;border:1px solid #374151;background:#0b1220;color:var(--text)}
.full{grid-column:1/-1}
.btn{padding:.7rem 1rem;border-radius:10px;border:1px solid #374151;background:#0b1220;color:var(--text);font-weight:600}
.btn.primary{background:#0ea5e9;border-color:#0284c7}
.btn.good{background:#16a34a;border-color:#15803d}
.btn.bad{background:#dc2626;border-color:#991b1b}
.row{display:flex;gap:.5rem;flex-wrap:wrap}
.hidden{display:none}
footer{text-align:center;font-size:.8rem;color:var(--muted);padding:1rem}

/* ===== PDF ===== */
@media print{
  body{background:white;color:black}
  header,footer,main>section:not(#printArea){display:none}
  #printArea{display:block}
}
</style>
</head>

<body>

<header>
  <h1>Devis • ACJ Services</h1>
</header>

<main>

<!-- ===== UTILISATEUR ===== -->
<section class="card" id="userCard">
  <h3>Utilisateur</h3>
  <div class="row">
    <select id="userSelect"></select>
    <button class="btn" onclick="addUser()">+ Ajouter</button>
    <button class="btn" onclick="removeUser()">– Retirer</button>
  </div>
</section>

<!-- ===== PARAMÈTRES ===== -->
<section class="card">
  <div class="grid">
    <label>Mode
      <select id="mode">
        <option value="jardin">Jardin</option>
        <option value="bricol">Bricolage</option>
        <option value="nettoyage">Nettoyage</option>
      </select>
    </label>

    <label>Intervenant
      <input id="intervenant" placeholder="Nom intervenant">
    </label>

    <label class="full">Client
      <input id="client">
    </label>

    <label class="full">Adresse
      <input id="adresse">
    </label>

    <label>TVA %
      <input id="tva" type="number" value="20">
    </label>

    <label>Taux horaire €
      <input id="taux" type="number" value="45">
    </label>
  </div>
</section>

<!-- ===== JARDIN ===== -->
<section class="card" id="blocJardin">
  <div class="grid">
    <label>Surface m²<input id="j_surface" type="number"></label>
    <label>Haies ml<input id="j_haies" type="number"></label>
    <label>Heures<input id="j_heures" type="number"></label>
  </div>
</section>

<!-- ===== BRICOL ===== -->
<section class="card hidden" id="blocBricol">
  <div class="grid">
    <label class="full">Description<input id="b_desc"></label>
    <label>Quantité<input id="b_qte" type="number" value="1"></label>
    <label>PU TTC<input id="b_pu" type="number" value="60"></label>
  </div>
</section>

<!-- ===== NETTOYAGE ===== -->
<section class="card hidden" id="blocNettoyage">
  <div class="grid">
    <label>Heures<input id="n_heures" type="number"></label>
    <label>Taux<input id="n_taux" type="number" value="35"></label>
    <label>Machines €<input id="n_machines" type="number"></label>
    <label>Produits €<input id="n_produits" type="number"></label>
  </div>
</section>

<!-- ===== TOTAL ===== -->
<section class="card">
  <h3>Total</h3>
  <div id="total"></div>
  <div class="row" style="margin-top:.5rem">
    <button class="btn primary" onclick="share()">Partager</button>
    <button class="btn good" onclick="preparePrint();window.print()">PDF</button>
    <button class="btn bad" onclick="resetAll()">Nouveau</button>
  </div>
</section>

<!-- ===== PDF ===== -->
<section id="printArea" class="hidden">
  <div style="display:flex;justify-content:space-between">
    <div>
      <h2>DEVIS</h2>
      <p>ACJ Services</p>
    </div>
    <img src="icon-192.png" style="width:80px">
  </div>
  <hr>
  <p>
    <strong>Client :</strong> <span id="pClient"></span><br>
    <strong>Adresse :</strong> <span id="pAdresse"></span><br>
    <strong>Utilisateur :</strong> <span id="pUser"></span><br>
    <strong>Intervenant :</strong> <span id="pInter"></span>
  </p>
  <h3>Total TTC : <span id="pTotal"></span> €</h3>
  <p style="margin-top:2rem;font-size:.8rem;text-align:center">
    Devis valable 30 jours – ACJ Services
  </p>
</section>

</main>

<footer>© ACJ Services</footer>

<script>
const $=s=>document.querySelector(s);
const num=v=>parseFloat(v||0)||0;

/* ===== USERS ===== */
const USER_KEY='acj_users';
function loadUsers(){
  let u=JSON.parse(localStorage.getItem(USER_KEY)||'["Admin"]');
  const s=$('#userSelect');s.innerHTML='';
  u.forEach(x=>{let o=document.createElement('option');o.textContent=x;s.appendChild(o)});
}
function addUser(){
  const n=prompt("Nom utilisateur ?");
  if(!n)return;
  let u=JSON.parse(localStorage.getItem(USER_KEY)||'[]');
  u.push(n);localStorage.setItem(USER_KEY,JSON.stringify(u));loadUsers();
}
function removeUser(){
  let u=JSON.parse(localStorage.getItem(USER_KEY)||'[]');
  u=u.filter(x=>x!==$('#userSelect').value);
  localStorage.setItem(USER_KEY,JSON.stringify(u));loadUsers();
}

/* ===== MODE ===== */
$('#mode').addEventListener('change',()=>{
  ['jardin','bricol','nettoyage'].forEach(m=>{
    $('#bloc'+m.charAt(0).toUpperCase()+m.slice(1)).classList.toggle('hidden',$('#mode').value!==m)
  })
  calc();
})

function calc(){
  let t=0;
  if(mode.value==='jardin') t=num(j_heures.value)*num(taux.value);
  if(mode.value==='bricol') t=num(b_qte.value)*num(b_pu.value);
  if(mode.value==='nettoyage') t=(num(n_heures.value)*num(n_taux.value))+num(n_machines.value)+num(n_produits.value);
  t=t*(1+num(tva.value)/100);
  total.textContent=t.toFixed(2)+' € TTC';
  return t;
}

document.addEventListener('input',calc);

/* ===== PDF ===== */
function preparePrint(){
  pClient.textContent=client.value;
  pAdresse.textContent=adresse.value;
  pUser.textContent=userSelect.value;
  pInter.textContent=intervenant.value;
  pTotal.textContent=calc().toFixed(2);
}

/* ===== SHARE ===== */
function share(){
  navigator.share?.({
    title:'Devis ACJ Services',
    text:`Devis ${client.value}\nTotal ${calc().toFixed(2)} € TTC`
  })
}

/* ===== RESET ===== */
function resetAll(){
  if(!confirm("Nouveau devis ?"))return;
  document.querySelectorAll('input').forEach(i=>i.value='');
  calc();
}

/* INIT */
loadUsers();
calc();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script>

</body>
</html>
